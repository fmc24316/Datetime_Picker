<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>MaaS 隨行助手 - 預約時間</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  :root{
    --green:#06C755; --green-dark:#05A847; --green-soft:#E7F8EE;
    --text:#111827; --sub:#4B5563; --muted:#9CA3AF; --line:#E5E7EB;
    --bg:#F4F5F7; --warn:#B45309; --warn-bg:#FEF3C7; --red:#EF4444;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",Roboto,sans-serif;
    color:var(--text);background:#fff;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font-family:inherit;border:none;background:none;padding:0;color:inherit;cursor:pointer;}

  /* 整頁固定為視窗高度，設計目標是 LIFF Compact（約半個螢幕）也不用捲動 */
  .app{position:relative;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#fff;}
  .content{flex:1;min-height:0;overflow-y:auto;padding:10px 14px 6px;display:flex;flex-direction:column;gap:8px;}

  .head{display:flex;align-items:center;justify-content:space-between;height:28px;flex-shrink:0;}
  .head h1{margin:0;font-size:16px;font-weight:700;}
  .head-r{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
  .test-pill{display:none;font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:999px;}
  .test-pill.show{display:inline-block;}

  /* 取車／還車切換（同時當作摘要） */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:14px;padding:4px;flex-shrink:0;}
  .seg-btn{height:48px;border-radius:11px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 12px;transition:background .2s,box-shadow .2s;}
  .seg-btn small{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .seg-btn small i{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .seg-btn small i.hollow{background:transparent;border:2px solid var(--green);}
  .seg-btn b{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px;}
  .seg-btn.active{background:#fff;box-shadow:0 2px 8px rgba(17,24,39,.08);}
  .seg-btn.active b{color:var(--green-dark);}

  /* 橫向捲動列 */
  .strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px;flex-shrink:0;}
  .strip::-webkit-scrollbar{display:none;}

  .dchip{
    flex-shrink:0;width:52px;height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .dchip:active{transform:scale(.94);}
  .dchip small{font-size:10px;color:var(--muted);font-weight:700;}
  .dchip b{font-size:15px;font-variant-numeric:tabular-nums;}
  .dchip.sel{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 10px rgba(6,199,85,.3);}
  .dchip.sel small{color:rgba(255,255,255,.85);}
  .dchip:disabled{background:#F6F7F9;border-color:transparent;color:#C9CDD3;cursor:not-allowed;transform:none;}
  .dchip.off small{color:var(--red);}
  .dchip.off b{text-decoration:line-through;}

  .tchip{
    flex-shrink:0;min-width:62px;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;
    font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .15s,transform .1s;
  }
  .tchip:active{transform:scale(.94);}
  .tchip.sel{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 10px rgba(6,199,85,.3);}
  .tchip:disabled{background:#F6F7F9;border-color:transparent;color:#C9CDD3;cursor:not-allowed;transform:none;}
  .strip-empty{font-size:12px;color:var(--muted);height:40px;display:flex;align-items:center;}

  /* 快速租期列／自訂提示（固定高度，切換時版面不跳動） */
  .row5{height:36px;flex-shrink:0;display:flex;align-items:center;}
  .dur-wrap{display:flex;align-items:center;gap:6px;width:100%;}
  .dur-label{flex-shrink:0;font-size:12px;font-weight:700;color:var(--sub);padding-right:2px;}
  .dur-strip{flex:1;min-width:0;}
  .dur{flex-shrink:0;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;transition:all .15s;}
  .dur.sel{background:var(--green-soft);border-color:var(--green);color:var(--green-dark);}
  .custom-hint{width:100%;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:10px;background:var(--green-soft);font-size:12px;color:var(--green-dark);font-weight:700;}
  .back-quick{font-size:12px;font-weight:700;color:var(--green-dark);text-decoration:underline;height:34px;}

  /* 底部固定列 */
  .bar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 14px calc(8px + var(--safe-b));border-top:1px solid var(--line);background:#fff;transition:background .2s;}
  .bar.warn{background:var(--warn-bg);border-top-color:#FCD34D;}
  .bar-info{flex:1;min-width:0;}
  .bar-dur{font-size:17px;font-weight:700;line-height:1.25;}
  .bar-range{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
  .bar.warn .bar-dur{font-size:13px;color:var(--warn);}
  .bar.warn .bar-range{color:#D97706;}
  .submit{flex-shrink:0;height:44px;padding:0 18px;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:700;box-shadow:0 5px 14px rgba(6,199,85,.28);transition:all .2s;}
  .submit:disabled{background:#D1D5DB;box-shadow:none;cursor:not-allowed;}
  .submit.fix{background:#fff;color:var(--warn);border:1.5px solid #F59E0B;box-shadow:none;font-size:13px;padding:0 12px;}

  .loading{position:absolute;inset:0;z-index:5;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--sub);transition:opacity .3s;}
  .loading.hide{opacity:0;pointer-events:none;}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--green-soft);border-top-color:var(--green);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:absolute;left:50%;top:10px;z-index:6;transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:rgba(17,24,39,.92);color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;transition:all .25s;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .fade{animation:fade .2s ease;}
  @keyframes fade{from{opacity:.4;}to{opacity:1;}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="loading" id="loading"><div class="spinner"></div><div id="loadingText">系統連線中，請稍候...</div></div>

  <div class="content">
    <div class="head">
      <h1>預約租車時間</h1>
      <div class="head-r"><span class="test-pill" id="testPill">測試模式</span>營業 09:00–20:00・最少 24 小時</div>
    </div>

    <div class="seg">
      <button class="seg-btn active" id="segStart"><small><i></i>取車</small><b id="segStartV">--</b></button>
      <button class="seg-btn" id="segEnd"><small><i class="hollow"></i>還車</small><b id="segEndV">--</b></button>
    </div>

    <div class="strip" id="dateStrip"></div>
    <div class="strip" id="timeStrip"></div>
    <div class="row5" id="row5"></div>
  </div>

  <div class="bar" id="bar">
    <div class="bar-info">
      <div class="bar-dur" id="barDur">--</div>
      <div class="bar-range" id="barRange"></div>
    </div>
    <button class="submit" id="submitBtn" disabled>確認並送出</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
 * 設定區
 * ========================================================= */
const MY_LIFF_ID = '1653833628-9c1v7iPE';
const API_URL = 'https://yamicar-nodate.fmc24316.workers.dev/';
const BOOKING_DAYS = 60;       // 可選的取車日數（從今天起算）
const MAX_RENT_DAYS = 60;      // 最長租期（天）
const MIN_RENT_MINUTES = 1440; // 最短租期：24 小時
const OPEN_MIN = 9 * 60;       // 營業開始 09:00
const CLOSE_MIN = 20 * 60;     // 營業結束 20:00（含 20:00 這個時段）
const SLOT_MINUTES = 30;       // 時段間隔
const LEAD_MINUTES = 0;        // 當天預約需提前幾分鐘；0 = 下一個時段，例如 15:55 → 16:00
const DEFAULT_DUR = '1d';      // 預設租期
const DURS = [
  { k:'1d', label:'1 天', min:1440 },
  { k:'2d', label:'2 天', min:2880 },
  { k:'3d', label:'3 天', min:4320 },
  { k:'1w', label:'1 週', min:10080 },
  { k:'2w', label:'2 週', min:20160 }
];
const WEEK = ['日','一','二','三','四','五','六'];

/* ===== 狀態 =====
 * sd/st：取車日期、時間；rd/rt：還車日期、時間
 * dur：快速租期代碼；null 代表自訂
 * mode：目前編輯的是 'start'（取車）或 'end'（還車）
 */
const S = { sd:'', st:'', rd:'', rt:'', dur:DEFAULT_DUR };
let mode = 'start';
let noWorkDates = [];
let liffReady = false;
const $ = id => document.getElementById(id);

/* =========================================================
 * 日期工具（一律用本地時間解析，避免 new Date('YYYY-MM-DD') 被當成 UTC 而差一天）
 * ========================================================= */
const pad = n => String(n).padStart(2,'0');
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fromMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
function toDT(k, t){ const d = parseKey(k); const [h,m] = t.split(':').map(Number); d.setHours(h,m,0,0); return d; }
function disp(k){ const d = parseKey(k); return `${d.getMonth()+1}/${d.getDate()}(${WEEK[d.getDay()]})`; }
const todayKey = () => toKey(new Date());

const SLOTS = []; for (let m = OPEN_MIN; m <= CLOSE_MIN; m += SLOT_MINUTES) SLOTS.push(fromMin(m));
function startDates(){ return Array.from({ length: BOOKING_DAYS }, (_, i) => toKey(addDays(new Date(), i))); }

/* =========================================================
 * 規則判斷
 * ========================================================= */
const isOff = k => noWorkDates.includes(k);
const inHours = t => toMin(t) >= OPEN_MIN && toMin(t) <= CLOSE_MIN;
const rentMinutes = (rd, rt) => (toDT(rd, rt) - toDT(S.sd, S.st)) / 60000;

// 取車時段是否不能選：時段開始時間必須「晚於或等於現在＋提前分鐘數」
// 例：現在 15:55 → 15:30 不能選、16:00 可以選
function startSlotDis(k, t){
  if (!inHours(t)) return true;
  return toDT(k, t).getTime() < Date.now() + LEAD_MINUTES * 60000;
}
// 還車時段是否不能選：租期至少 24 小時，最多 MAX_RENT_DAYS 天
function endSlotDis(k, t){
  if (!S.sd || !S.st || !inHours(t)) return true;
  const diff = rentMinutes(k, t);
  return diff < MIN_RENT_MINUTES || diff > MAX_RENT_DAYS * 1440;
}
const firstStartSlot = k => SLOTS.find(t => !startSlotDis(k, t)) || '';
const firstEndSlot = k => SLOTS.find(t => !endSlotDis(k, t)) || '';
const startDateDis = k => isOff(k) || !firstStartSlot(k);
const endDateDis = k => isOff(k) || !firstEndSlot(k);
// 還車日清單：取車隔天起，到最長租期為止（同一天還車一定未滿 24 小時）
function endDates(){
  if (!S.sd) return [];
  return Array.from({ length: MAX_RENT_DAYS }, (_, i) => toKey(addDays(parseKey(S.sd), i + 1)));
}

// 依照快速租期算出還車時間（還車日可能是公休日，交給 problem() 提醒）
function computeEnd(){
  const d = DURS.find(x => x.k === S.dur);
  if (!d || !S.sd || !S.st) return;
  const end = new Date(toDT(S.sd, S.st).getTime() + d.min * 60000);
  S.rd = toKey(end);
  S.rt = `${pad(end.getHours())}:${pad(end.getMinutes())}`;
}

// 找出最接近、而且合法的還車時間（給一鍵修正用）：往後找營業日，同一時間優先
function suggestFix(){
  const base = S.rd && S.rd > S.sd ? S.rd : toKey(addDays(parseKey(S.sd), 1));
  for (let i = 0; i <= MAX_RENT_DAYS; i++){
    const key = toKey(addDays(parseKey(base), i));
    if (isOff(key)) continue;
    if (S.rt && !endSlotDis(key, S.rt)) return { rd:key, rt:S.rt };
    const f = firstEndSlot(key);
    if (f) return { rd:key, rt:f };
  }
  return null;
}

// 檢查目前的選擇；沒問題回傳 null，有問題回傳 { msg, fix }
function problem(){
  if (!(S.sd && S.st)) return { msg:'近期沒有可預約的取車時段', fix:null };
  if (!(S.rd && S.rt)) return { msg:'請選擇還車時間', fix:null };
  let msg = '';
  const diff = rentMinutes(S.rd, S.rt);
  if (isOff(S.rd)) msg = `還車日 ${disp(S.rd)} 為公休日`;
  else if (!inHours(S.rt)) msg = `還車 ${S.rt} 超出營業時間`;
  else if (diff < MIN_RENT_MINUTES) msg = '租期至少需要 24 小時';
  else if (diff > MAX_RENT_DAYS * 1440) msg = `最長租期為 ${MAX_RENT_DAYS} 天`;
  if (!msg) return null;
  return { msg, fix: suggestFix() };
}

function durText(){
  const m = rentMinutes(S.rd, S.rt);
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  return '共' + (d ? ` ${d} 天` : '') + (h ? ` ${h} 小時` : '') + (mm ? ` ${mm} 分` : '');
}

// 取車改變後調整還車：有快速租期就重算；自訂時盡量保留，不合法才調整
function reconcileEnd(){
  if (S.dur){ computeEnd(); return; }
  if (S.rd && S.rt && !isOff(S.rd) && !endSlotDis(S.rd, S.rt)) return;
  S.dur = DEFAULT_DUR; computeEnd(); S.dur = null;
  if (isOff(S.rd) || endSlotDis(S.rd, S.rt)){ const f = suggestFix(); if (f){ S.rd = f.rd; S.rt = f.rt; } }
}

// 預設：最近一個可預約的取車時段＋1 天
function setDefaultStart(){
  S.sd = startDates().find(k => !startDateDis(k)) || '';
  S.st = S.sd ? firstStartSlot(S.sd) : '';
}

/* =========================================================
 * 畫面繪製
 * ========================================================= */
function renderDates(){
  const isStart = mode === 'start';
  const keys = isStart ? startDates() : endDates();
  const sel = isStart ? S.sd : S.rd;
  const today = todayKey();
  $('dateStrip').innerHTML = keys.map(k => {
    const d = parseKey(k), off = isOff(k);
    const dis = isStart ? startDateDis(k) : endDateDis(k);
    const top = off ? '公休' : (k === today ? '今天' : '週' + WEEK[d.getDay()]);
    return `<button class="dchip${off ? ' off' : ''}${k === sel ? ' sel' : ''}" data-k="${k}"${dis ? ' disabled' : ''}>
      <small>${top}</small><b>${d.getMonth()+1}/${d.getDate()}</b></button>`;
  }).join('');
}
function renderTimes(){
  const isStart = mode === 'start';
  const k = isStart ? S.sd : S.rd;
  const sel = isStart ? S.st : S.rt;
  if (!k){ $('timeStrip').innerHTML = '<span class="strip-empty">請先選擇日期</span>'; return; }
  $('timeStrip').innerHTML = SLOTS.map(t => {
    const dis = isStart ? startSlotDis(k, t) : endSlotDis(k, t);
    return `<button class="tchip${t === sel ? ' sel' : ''}" data-t="${t}"${dis ? ' disabled' : ''}>${t}</button>`;
  }).join('');
}
function renderRow5(){
  if (mode === 'start'){
    $('row5').innerHTML = `<div class="dur-wrap"><span class="dur-label">租期</span>
      <div class="strip dur-strip">${DURS.map(d =>
        `<button class="dur${S.dur === d.k ? ' sel' : ''}" data-d="${d.k}">${d.label}</button>`).join('')}</div></div>`;
  } else {
    $('row5').innerHTML = `<div class="custom-hint"><span>✎ 自訂還車（至少 24 小時）</span>
      <button class="back-quick" data-back="1">改用快速租期</button></div>`;
  }
}
function renderBar(){
  const p = problem();
  const bar = $('bar'), btn = $('submitBtn');
  bar.classList.toggle('warn', !!(p && p.fix));
  btn.classList.remove('fix');
  if (!p){
    $('barDur').textContent = durText();
    $('barRange').textContent = `${disp(S.sd)} ${S.st} → ${disp(S.rd)} ${S.rt}`;
    btn.textContent = '確認並送出'; btn.disabled = false;
  } else if (p.fix){
    // 有問題但可以修正：送出按鈕暫時變成一鍵修正
    $('barDur').textContent = '⚠ ' + p.msg;
    $('barRange').textContent = `建議改為 ${disp(p.fix.rd)} ${p.fix.rt} 還車`;
    btn.textContent = `改為 ${disp(p.fix.rd)} ${p.fix.rt}`;
    btn.classList.add('fix'); btn.disabled = false;
  } else {
    $('barDur').textContent = p.msg;
    $('barRange').textContent = '';
    btn.textContent = '確認並送出'; btn.disabled = true;
  }
}
function renderSeg(){
  $('segStart').classList.toggle('active', mode === 'start');
  $('segEnd').classList.toggle('active', mode === 'end');
  $('segStartV').textContent = S.sd ? `${disp(S.sd)} ${S.st}` : '--';
  $('segEndV').textContent = S.rd ? `${disp(S.rd)} ${S.rt}` : '--';
}
// 讓選到的項目捲到中間
function centerSel(el, smooth){
  const sel = el.querySelector('.sel') || el.querySelector('button:not(:disabled)');
  if (!sel) return;
  const left = sel.offsetLeft - el.clientWidth / 2 + sel.offsetWidth / 2;
  el.scrollTo({ left, behavior: smooth ? 'smooth' : 'auto' });
}
function render(opts = {}){
  renderSeg(); renderDates(); renderTimes(); renderRow5(); renderBar();
  requestAnimationFrame(() => {
    centerSel($('dateStrip'), opts.smooth);
    centerSel($('timeStrip'), opts.smooth);
  });
}
function switchMode(m){
  if (m === mode) return;
  if (m === 'end' && !(S.sd && S.st)){ toast('請先選擇取車時間'); return; }
  mode = m;
  if (m === 'end' && !S.rd){ S.dur = DEFAULT_DUR; computeEnd(); }
  console.log(`[UI] 切換到${m === 'start' ? '取車' : '還車'}`);
  render();
  $('dateStrip').classList.remove('fade'); void $('dateStrip').offsetWidth; $('dateStrip').classList.add('fade');
}

// 頁面開著放太久時，原本選的取車時段可能已經過去，自動更新成下一個可預約時段
function ensureStartStillValid(){
  if (S.sd && S.st && !startSlotDis(S.sd, S.st)) return false;
  const old = S.sd ? `${disp(S.sd)} ${S.st}` : '';
  if (S.sd && firstStartSlot(S.sd) && !isOff(S.sd)) S.st = firstStartSlot(S.sd);
  else setDefaultStart();
  reconcileEnd();
  console.log(`[State] 取車時段 ${old} 已過，更新為 ${S.sd} ${S.st}`);
  render();
  toast(`取車時間已更新為 ${disp(S.sd)} ${S.st}`);
  return true;
}

/* =========================================================
 * 事件（用事件委派，每個容器只綁一次）
 * ========================================================= */
function bindEvents(){
  $('segStart').addEventListener('click', () => switchMode('start'));
  $('segEnd').addEventListener('click', () => switchMode('end'));

  $('dateStrip').addEventListener('click', e => {
    const b = e.target.closest('.dchip'); if (!b || b.disabled) return;
    const k = b.dataset.k;
    if (mode === 'start'){
      S.sd = k;
      if (!S.st || startSlotDis(k, S.st)) S.st = firstStartSlot(k);
      reconcileEnd();
      console.log(`[Action] 選擇取車日期: ${k} ${S.st}`);
    } else {
      S.rd = k; S.dur = null;              // 在還車分頁選擇，就變成自訂
      if (!S.rt || endSlotDis(k, S.rt)) S.rt = endSlotDis(k, S.st) ? firstEndSlot(k) : S.st;
      console.log(`[Action] 選擇還車日期: ${k} ${S.rt}`);
    }
    render({ smooth:true });
  });

  $('timeStrip').addEventListener('click', e => {
    const b = e.target.closest('.tchip'); if (!b || b.disabled) return;
    if (mode === 'start'){ S.st = b.dataset.t; reconcileEnd(); console.log(`[Action] 選擇取車時間: ${S.st}`); }
    else { S.rt = b.dataset.t; S.dur = null; console.log(`[Action] 選擇還車時間: ${S.rt}`); }
    render({ smooth:true });
  });

  $('row5').addEventListener('click', e => {
    const d = e.target.closest('[data-d]');
    if (d){ S.dur = d.dataset.d; computeEnd(); console.log(`[Action] 選擇租期: ${S.dur} → 還車 ${S.rd} ${S.rt}`); render({ smooth:true }); return; }
    if (e.target.closest('[data-back]')){
      S.dur = DEFAULT_DUR; computeEnd(); mode = 'start'; render();
    }
  });

  $('submitBtn').addEventListener('click', () => {
    if (ensureStartStillValid()) return;   // 取車時間已過就先更新，讓使用者再確認一次
    const p = problem();
    if (p && p.fix){                       // 一鍵修正
      S.rd = p.fix.rd; S.rt = p.fix.rt; S.dur = null;
      render({ smooth:true }); toast(`已改為 ${disp(S.rd)} ${S.rt} 還車`);
      return;
    }
    if (!p) submit();
  });

  // 每 30 秒檢查一次取車時段是否已過（頁面開著沒動時）
  setInterval(ensureStartStillValid, 30000);
}

let toastTimer;
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000); }

/* =========================================================
 * 送出（字串格式和原本一樣，後端不用改）
 * ========================================================= */
async function submit(){
  const messageText = `起租:${S.sd} ${S.st}, 還車:${S.rd} ${S.rt}`;
  console.log(`[LIFF] 準備發送訊息: ${messageText}`);
  if (liffReady && liff.isInClient()){
    const btn = $('submitBtn'); btn.disabled = true; btn.textContent = '送出中...';
    try {
      await liff.sendMessages([{ type:'text', text: messageText }]);
      console.log('[LIFF] 訊息發送成功，關閉視窗');
      liff.closeWindow();
    } catch (err){
      console.error('[Error] 發送訊息失敗:', err);
      toast('發送失敗，請檢查網路後再試');
      btn.disabled = false; btn.textContent = '確認並送出';
    }
  } else {
    console.log(`[Test] 測試環境模擬發送: ${messageText}`);
    alert(`測試環境發送字串:\n${messageText}`);
  }
}

/* =========================================================
 * API 與 LIFF
 * ========================================================= */
async function fetchNoWorkDates(){
  console.log(`[API] 準備呼叫 API: ${API_URL}`);
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 5000);
  try {
    const res = await fetch(API_URL, { headers:{ 'Accept':'application/json' }, signal: ctrl.signal });
    console.log(`[API] 回應狀態碼: ${res.status}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    noWorkDates = Array.isArray(data) ? data : [];
    console.log('[API] 不可營業日清單:', JSON.stringify(noWorkDates));
  } catch (e){
    console.error('[Error] API 發生錯誤，將預設全日期皆可營業:', e.message);
    noWorkDates = [];
  } finally { clearTimeout(timer); }
}
async function initLiff(){
  console.log('[LIFF] 開始初始化...');
  try {
    if (!window.liff) throw new Error('LIFF SDK 未載入');
    await liff.init({ liffId: MY_LIFF_ID });
    liffReady = true;
    console.log('[LIFF] 初始化成功');
    if (!liff.isInClient()) $('testPill').classList.add('show');
  } catch (err){
    console.error('[Error] LIFF 初始化失敗:', err);
    $('testPill').textContent = '未連線 LINE';
    $('testPill').classList.add('show');
  }
}

/* ===== 啟動：預設最近可預約時段＋1 天，打開就可以直接送出 ===== */
window.addEventListener('load', async () => {
  console.log('[System] 網頁載入完成，開始執行主程式');
  try {
    bindEvents();
    await fetchNoWorkDates();
    setDefaultStart();
    computeEnd();
    render();
    $('loading').classList.add('hide');
    initLiff();
  } catch (error){
    console.error('[Exception] 系統執行發生錯誤:', error);
    $('loadingText').textContent = '系統發生錯誤，請重新整理網頁。';
  }
});
</script>
